<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MEXC PRO TERMINAL</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<div class="header">
    <div style="display:flex; align-items:center; gap:20px;">
        <div class="logo">MEXC <span>PRO</span></div>
        <nav style="display:flex; gap:4px;">
            <a href="/" class="btn active" style="text-decoration:none;">📈 Терминал</a>
            <a href="/scanner.html" class="btn" style="text-decoration:none;">🔍 Сканер</a>
        </nav>
    </div>
    <div class="toolbar">
        <div class="search-wrap">
            <input type="text" id="symbolInput" class="search-input" value="BTCUSDT" placeholder="Поиск пары..." autocomplete="off">
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>
        <div style="width: 1px; height: 20px; background: var(--border); margin: 0 10px;"></div>
        <!-- Кнопки таймфреймов -->
        <button class="btn tf-btn active" data-tf="1m">1m</button>
        <button class="btn tf-btn" data-tf="5m">5m</button>
        <button class="btn tf-btn" data-tf="15m">15m</button>
        <button class="btn tf-btn" data-tf="60m">1H</button>
    </div>
</div>

<div class="main-grid">
    <div class="left-col">
        <!-- Основной график -->
        <div class="chart-container" id="chart"></div>

        <!-- Заголовок индикатора -->
        <div class="indicator-header">
            <span class="ind-title">BID/ASK SPOT TOTAL</span>
            <div class="ind-legend">
                <span id="legBid" class="leg-item c-green">BID — $0</span>
                <span id="legAsk" class="leg-item" style="color:#F59E0B;">ASK — $0</span>
                <span id="legDiff" class="leg-item" style="color:#94a3b8;">DIFF — $0</span>
            </div>
        </div>

        <!-- График индикатора -->
        <div class="indicator-container" id="indicatorChart"></div>

        <!-- Метрики -->
        <div class="metrics-bar">
            <div class="metric-box">
                <div class="m-title">BID LIMITS (USD)</div>
                <div class="m-value c-green" id="vBid">$0</div>
            </div>
            <div class="metric-box">
                <div class="m-title">ASK LIMITS (USD)</div>
                <div class="m-value c-red" id="vAsk">$0</div>
            </div>
            <div class="metric-box">
                <div class="m-title">IMBALANCE</div>
                <div class="m-value" id="vImb">1.00x</div>
            </div>
        </div>

        <div id="log">System initializing...</div>
    </div>

    <!-- Стакан -->
    <div class="right-col">
        <div class="ob-header">Order Book (Depth 5%)</div>
        <div class="ob-table-head">
            <span>Price (USDT)</span>
            <span>Amount</span>
            <span>Total (USD)</span>
        </div>
        <div class="ob-list">
            <div class="ob-asks" id="obAsks"></div>
            <div class="ob-mid" id="obMidPrice">0.00</div>
            <div class="ob-bids" id="obBids"></div>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let symbol = urlParams.get('symbol') || 'BTCUSDT';
    let interval = '1m';
    let allSymbols = [];

    // Множители секунд для агрегации данных индикатора
    const tfSeconds = { '1m': 60, '5m': 300, '15m': 900, '60m': 3600 };

    let chart, candleSeries;
    let indicatorChart, bidLine, askLine;
    let syncingMain = false, syncingInd = false;

    // Глобальные переменные для сохранения состояния текущей свечи/точки
    let currentCandle = null;
    let currentIndBucket = null;

    const $ = id => document.getElementById(id);

    function writeLog(m) { $('log').innerText = `[${new Date().toLocaleTimeString()}] ${m}`; }
    function fmtPrice(p) { return p > 1000 ? p.toLocaleString('en-US') : p.toFixed(4); }
    function fmtNum(n) { return n >= 1e9 ? (n/1e9).toFixed(2)+'B' : n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : n.toFixed(1); }
    function fmtLeg(n) { return '$' + fmtNum(n); }

    // ── Autocomplete поиска ───────────────────────────────────────────────
    async function loadSymbols() {
        try {
            const res = await fetch('/api/symbols');
            allSymbols = await res.json();
        } catch(e) { allSymbols = ['BTCUSDT','ETHUSDT','SOLUSDT']; }
    }

    function showDropdown(query) {
        const dd = $('searchDropdown');
        const q = query.toUpperCase();
        if (!q) { dd.style.display = 'none'; return; }
        const matches = allSymbols.filter(s => s.startsWith(q) || s.includes(q)).slice(0, 10);
        if (!matches.length) { dd.style.display = 'none'; return; }
        dd.innerHTML = matches.map(s => {
            const base = s.replace(/USDT$/, '');
            return `<div class="dd-item" data-symbol="${s}"><span class="dd-base">${base}</span><span class="dd-quote">/USDT</span></div>`;
        }).join('');
        dd.style.display = 'block';
        dd.querySelectorAll('.dd-item').forEach(el => {
            el.addEventListener('mousedown', (e) => { e.preventDefault(); selectSymbol(el.dataset.symbol); });
        });
    }

    function selectSymbol(sym) {
        $('symbolInput').value = sym;
        $('searchDropdown').style.display = 'none';
        symbol = sym;
        currentCandle = null;
        currentIndBucket = null;
        candleSeries.setData([]);
        bidLine.setData([]);
        askLine.setData([]);
        $('obAsks').innerHTML = '';
        $('obBids').innerHTML = '';
        loadKlines();
        loadHistory();
        tick();
        writeLog(`Загрузка ${sym}...`);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const inp = $('symbolInput');
        inp.addEventListener('input', () => showDropdown(inp.value));
        inp.addEventListener('focus', () => showDropdown(inp.value));
        inp.addEventListener('blur', () => setTimeout(() => { $('searchDropdown').style.display = 'none'; }, 150));
    });

    // ── Инициализация графиков ────────────────────────────────────────────────
    function initChart() {
        const container = $('chart');
        chart = LightweightCharts.createChart(container, {
            layout: { background: { color: '#0b0e14' }, textColor: '#64748b' },
            grid: { vertLines: { color: '#151822' }, horzLines: { color: '#151822' } },
            rightPriceScale: { borderColor: '#222633' },
            timeScale: { borderColor: '#222633', timeVisible: true, visible: false }, 
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: '#00E592', downColor: '#FF4976',
            wickUpColor: '#00E592', wickDownColor: '#FF4976',
            borderVisible: false
        });

        const indContainer = $('indicatorChart');
        indicatorChart = LightweightCharts.createChart(indContainer, {
            layout: { background: { color: '#0b0e14' }, textColor: '#64748b' },
            grid: { vertLines: { color: '#151822' }, horzLines: { color: '#151822' } },
            rightPriceScale: { borderColor: '#222633', scaleMargins: { top: 0.1, bottom: 0.1 } },
            timeScale: { borderColor: '#222633', timeVisible: true },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        });

        bidLine = indicatorChart.addLineSeries({ color: '#00E592', lineWidth: 2, priceLineVisible: false, title: 'BID' });
        askLine = indicatorChart.addLineSeries({ color: '#F59E0B', lineWidth: 2, priceLineVisible: false, title: 'ASK' });

        // Синхронизация масштабирования
        chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
            if (syncingMain) return;
            syncingInd = true;
            indicatorChart.timeScale().setVisibleLogicalRange(range);
            syncingInd = false;
        });
        indicatorChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
            if (syncingInd) return;
            syncingMain = true;
            chart.timeScale().setVisibleLogicalRange(range);
            syncingMain = false;
        });

        // Синхронизация курсора
        chart.subscribeCrosshairMove(param => {
            if (!param.time) return;
            indicatorChart.setCrosshairPosition(0, param.time, bidLine);
        });
        indicatorChart.subscribeCrosshairMove(param => {
            if (!param.time) return;
            chart.setCrosshairPosition(0, param.time, candleSeries);
        });

        window.addEventListener('resize', () => {
            chart.resize(container.clientWidth, container.clientHeight);
            indicatorChart.resize(indContainer.clientWidth, indContainer.clientHeight);
        });
    }

    // ── Загрузка данных ──────────────────────────────────────────────────
    async function loadKlines() {
        try {
            writeLog(`Загрузка свечей ${interval}...`);
            const res = await fetch(`/api/klines?symbol=${symbol}&interval=${interval}`);
            const data = await res.json();
            const parsed = data.map(d => ({
                time: Math.floor(d[0]/1000),
                open: parseFloat(d[1]), high: parseFloat(d[2]),
                low: parseFloat(d[3]), close: parseFloat(d[4])
            }));
            candleSeries.setData(parsed);
            
            // Сохраняем последнюю свечу для корректного обновления
            if (parsed.length > 0) currentCandle = parsed[parsed.length - 1];
            
            chart.timeScale().fitContent();
        } catch(e) { writeLog("Ошибка загрузки свечей."); }
    }

    async function loadHistory() {
        try {
            const res = await fetch(`/api/history?symbol=${symbol}&limit=1000`);
            const data = await res.json();
            if (data.length > 0) {
                const coeff = tfSeconds[interval];
                const bidData = [];
                const askData = [];
                let bucket = null;

                // Агрегация индикатора под выбранный таймфрейм
                data.forEach(row => {
                    const t = Math.floor(new Date(row.time).getTime() / 1000);
                    const bucketTime = Math.floor(t / coeff) * coeff;

                    if (!bucket || bucket.time !== bucketTime) {
                        if (bucket) {
                            bidData.push({ time: bucket.time, value: bucket.bid });
                            askData.push({ time: bucket.time, value: bucket.ask });
                        }
                        bucket = { time: bucketTime, bid: row.bidUSD, ask: row.askUSD };
                    } else {
                        bucket.bid = row.bidUSD;
                        bucket.ask = row.askUSD;
                    }
                });

                if (bucket) {
                    bidData.push({ time: bucket.time, value: bucket.bid });
                    askData.push({ time: bucket.time, value: bucket.ask });
                    currentIndBucket = bucket; // Сохраняем последний бар индикатора
                }

                bidLine.setData(bidData);
                askLine.setData(askData);
                indicatorChart.timeScale().fitContent();

                const last = data[data.length - 1];
                updateLegend(last.bidUSD, last.askUSD);
            }
        } catch(e) {}
    }

    function updateLegend(bidUSD, askUSD) {
        const diff = bidUSD - askUSD;
        $('legBid').textContent = 'BID — ' + fmtLeg(bidUSD);
        $('legAsk').textContent = 'ASK — ' + fmtLeg(askUSD);
        $('legDiff').style.color = diff > 0 ? 'var(--green)' : diff < 0 ? 'var(--red)' : '#94a3b8';
        $('legDiff').textContent = 'DIFF — ' + (diff >= 0 ? '+' : '') + fmtLeg(diff);
    }

    // ── Отрисовка стакана ────────────────────────────────────────────────
    function renderOrderBook(book, currentPrice) {
        $('obMidPrice').innerText = fmtPrice(currentPrice);

        const asks = book.asks.slice(0, 15).reverse();
        const maxAsk = Math.max(...asks.map(a => parseFloat(a[0]) * parseFloat(a[1])));
        let htmlAsk = '', askTot = 0;
        asks.forEach(a => {
            const p = parseFloat(a[0]), v = parseFloat(a[1]), usd = p * v;
            askTot += usd;
            const w = Math.round((usd / maxAsk) * 100);
            htmlAsk += `<div class="ob-row"><div class="ob-bg bg-red" style="width:${w}%"></div><span class="c-red">${fmtPrice(p)}</span><span>${v.toFixed(3)}</span><span>${fmtNum(askTot)}</span></div>`;
        });
        $('obAsks').innerHTML = htmlAsk;

        const bids = book.bids.slice(0, 15);
        const maxBid = Math.max(...bids.map(b => parseFloat(b[0]) * parseFloat(b[1])));
        let htmlBid = '', bidTot = 0;
        bids.forEach(b => {
            const p = parseFloat(b[0]), v = parseFloat(b[1]), usd = p * v;
            bidTot += usd;
            const w = Math.round((usd / maxBid) * 100);
            htmlBid += `<div class="ob-row"><div class="ob-bg bg-green" style="width:${w}%"></div><span class="c-green">${fmtPrice(p)}</span><span>${v.toFixed(3)}</span><span>${fmtNum(bidTot)}</span></div>`;
        });
        $('obBids').innerHTML = htmlBid;
    }

    // ── Живое обновление (Tick) ──────────────────────────────────────────
    async function tick() {
        try {
            const res = await fetch(`/api/data?symbol=${symbol}&depth=5`);
            const data = await res.json();
            if (data.error) return;

            $('vBid').innerText = '$' + fmtNum(data.bidUSD);
            $('vAsk').innerText = '$' + fmtNum(data.askUSD);
            const imb = data.askUSD > 0 ? (data.bidUSD / data.askUSD) : 0;
            $('vImb').innerText = imb.toFixed(2) + 'x';
            $('vImb').style.color = imb > 1.2 ? 'var(--green)' : imb < 0.8 ? 'var(--red)' : 'white';

            updateLegend(data.bidUSD, data.askUSD);
            renderOrderBook(data.book, data.price);

            // === КОРРЕКТНОЕ ОБНОВЛЕНИЕ СВЕЧИ И ЛИНИЙ ===
            const t = Math.floor(Date.now() / 1000);
            const coeff = tfSeconds[interval];
            const alignedTime = Math.floor(t / coeff) * coeff; // Выравниваем время по таймфрейму

            // Обновляем СВЕЧУ
            if (!currentCandle || currentCandle.time !== alignedTime) {
                currentCandle = { time: alignedTime, open: data.price, high: data.price, low: data.price, close: data.price };
            } else {
                currentCandle.high = Math.max(currentCandle.high, data.price);
                currentCandle.low = Math.min(currentCandle.low, data.price);
                currentCandle.close = data.price;
            }
            try { candleSeries.update(currentCandle); } catch(e){}

            // Обновляем ИНДИКАТОР (в тот же alignedTime)
            if (!currentIndBucket || currentIndBucket.time !== alignedTime) {
                currentIndBucket = { time: alignedTime, bid: data.bidUSD, ask: data.askUSD };
            } else {
                currentIndBucket.bid = data.bidUSD;
                currentIndBucket.ask = data.askUSD;
            }
            try {
                bidLine.update({ time: alignedTime, value: currentIndBucket.bid });
                askLine.update({ time: alignedTime, value: currentIndBucket.ask });
            } catch(e){}

            writeLog(`Обновлено: ${symbol} | Цена: $${fmtPrice(data.price)}`);
        } catch(e) {}
    }

    // ── Переключение таймфреймов ──────────────────────────────────────────
    document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            interval = e.target.getAttribute('data-tf');
            
            // Очищаем графики и сбрасываем локальное состояние
            currentCandle = null;
            currentIndBucket = null;
            candleSeries.setData([]);
            bidLine.setData([]);
            askLine.setData([]);

            // Загружаем заново с учетом нового таймфрейма
            loadKlines();
            loadHistory();
        });
    });

    window.onload = () => {
        $('symbolInput').value = symbol;
        initChart();
        loadSymbols();
        loadKlines();
        loadHistory();
        setInterval(tick, 3000);
        tick();
    };
</script>
</body>
</html>
