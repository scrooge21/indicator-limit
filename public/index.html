<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MEXC PRO DEPTH</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg:#0a0c0f; --panel:#0f1217; --border:#1e2535; --text:#a0aec0; --green:#00d68f; --red:#ff4d6d; --accent:#4d9fff; }
        body { background: var(--bg); color: white; font-family: 'IBM Plex Sans', sans-serif; margin: 0; overflow-x: hidden; }
        .header { padding: 15px 20px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .chart-container { height: 500px; width: 100%; position: relative; border-bottom: 1px solid var(--border); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
        .panel { background: var(--panel); padding: 20px; }
        .btn { background: var(--border); border: 1px solid var(--border); color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .metric-val { font-size: 24px; font-weight: bold; margin: 10px 0; }
        .c-green { color: var(--green); } .c-red { color: var(--red); }
        #log { font-size: 10px; color: #384255; padding: 10px; font-family: monospace; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight: bold; color: var(--accent);">MEXC LIMIT TRACKER</div>
    <button class="btn" onclick="openSearch()">Выбрать пару: <span id="curPair">BTCUSDT</span></button>
</div>

<div class="chart-container" id="chart"></div>

<div class="grid">
    <div class="panel">
        <div style="color:var(--text)">BID VOLUME (USDT)</div>
        <div class="metric-val c-green" id="vBid">0</div>
        <div id="vBidCount">0 монет</div>
    </div>
    <div class="panel">
        <div style="color:var(--text)">ASK VOLUME (USDT)</div>
        <div class="metric-val c-red" id="vAsk">0</div>
        <div id="vAskCount">0 монет</div>
    </div>
</div>

<div id="log">System initializing...</div>

<script>
    let symbol = 'BTCUSDT';
    let chart, candleSeries, bidLine, askLine;
    const $ = id => document.getElementById(id);

    function writeLog(m) { $('log').innerText = `[${new Date().toLocaleTimeString()}] ${m}`; }

    function initChart() {
        const container = $('chart');
        if (!window.LightweightCharts) {
            writeLog("Error: Chart library not loaded!");
            return;
        }
        
        chart = LightweightCharts.createChart(container, {
            layout: { background: { color: '#0a0c0f' }, textColor: '#a0aec0' },
            grid: { vertLines: { color: '#161921' }, horzLines: { color: '#161921' } },
            rightPriceScale: { borderColor: '#1e2535' },
            leftPriceScale: { visible: true, borderColor: '#1e2535' },
            timeScale: { borderColor: '#1e2535', timeVisible: true }
        });

        candleSeries = chart.addCandlestickSeries({ priceScaleId: 'right' });
        bidLine = chart.addLineSeries({ color: '#00d68f', priceScaleId: 'left', lineWidth: 2 });
        askLine = chart.addLineSeries({ color: '#ff4d6d', priceScaleId: 'left', lineWidth: 2 });
        
        window.addEventListener('resize', () => chart.resize(container.clientWidth, container.clientHeight));
    }

    async function loadHistory() {
        try {
            const res = await fetch(`/api/history?symbol=${symbol}`);
            const data = await res.json();
            if (data.length > 0) {
                bidLine.setData(data.map(d => ({ time: new Date(d.timestamp).getTime()/1000, value: d.bidUSD })));
                askLine.setData(data.map(d => ({ time: new Date(d.timestamp).getTime()/1000, value: d.askUSD })));
            }
        } catch(e) {}
    }

    async function loadKlines() {
        try {
            const res = await fetch(`/api/klines?symbol=${symbol}`);
            const data = await res.json();
            candleSeries.setData(data.map(d => ({
                time: d[0]/1000, open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4])
            })));
        } catch(e) {}
    }

    async function tick() {
        try {
            const res = await fetch(`/api/data?symbol=${symbol}&depth=5`);
            const data = await res.json();
            if (data.error) return;

            $('vBid').innerText = '$' + Math.round(data.bidUSD).toLocaleString();
            $('vAsk').innerText = '$' + Math.round(data.askUSD).toLocaleString();
            $('curPair').innerText = symbol;

            const t = Math.floor(Date.now() / 1000);
            bidLine.update({ time: t, value: data.bidUSD });
            askLine.update({ time: t, value: data.askUSD });
            candleSeries.update({ time: Math.floor(t/60)*60, open: data.price, high: data.price, low: data.price, close: data.price });
            
            writeLog(`Updated ${symbol} - Price: ${data.price}`);
        } catch(e) { writeLog("Update error: " + e.message); }
    }

    function openSearch() {
        const p = prompt("Введите символ (например ETHUSDT):", symbol);
        if (p) {
            symbol = p.toUpperCase();
            candleSeries.setData([]); bidLine.setData([]); askLine.setData([]);
            loadKlines(); loadHistory();
        }
    }

    // Start
    window.onload = () => {
        initChart();
        loadKlines();
        loadHistory();
        setInterval(tick, 5000);
        tick();
    };
</script>
</body>
</html>
