name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # 1. Автотесты: MongoDB и интернет не нужны (биржа подменяется фикстурами)
      - name: Автотесты
        run: npm run test:ci
      - name: Отчёт JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-node${{ matrix.node }}
          path: reports/junit.xml

      # 2. Реальный запуск сервера и проверка его по HTTP (то же, что делается после деплоя)
      - name: Запуск сервера и smoke-проверка
        run: |
          cp .env.example .env
          PORT=10000 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:10000/api/health && break; sleep 1; done
          npm run test:smoke -- http://localhost:10000
      - name: Лог сервера при падении
        if: failure()
        run: cat server.log
